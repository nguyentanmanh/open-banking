spring:
  application:
    name: open-banking
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  messages:
    basename: messages
    fallback-to-system-locale: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-lab-platform-lab.i.aivencloud.com:25283}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME:mule-open-banking}"
        password="${KAFKA_PASSWORD:change-me-before-running}";
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_LOCATION:classpath:certs/aiven-truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: PKCS12
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${PORT:8080}
  shutdown: graceful
springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [service=${spring.application.name},requestId=%X{requestId:-},traceId=%X{traceId:-}] %logger{40} : %msg%n"
open-banking:
  kafka:
    balance-events:
      topic: ${KAFKA_BALANCE_EVENT_TOPIC:open-banking.balance.changed.v1}
      publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:PT10S}
  jwt:
    issuer: ${JWT_ISSUER:https://open-banking-7e1x.onrender.com}
    audience: ${JWT_AUDIENCE:open-banking-api}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    token-ttl: ${JWT_TOKEN_TTL:PT5M}
    test-scenarios-enabled: ${JWT_TEST_SCENARIOS_ENABLED:true}
    clients:
      - client-id: tpp-standard
        client-secret: ${TPP_STANDARD_CLIENT_SECRET:local-standard-secret}
        scopes:
          - transactions:read
      - client-id: tpp-premium
        client-secret: ${TPP_PREMIUM_CLIENT_SECRET:local-premium-secret}
        scopes:
          - transactions:read
---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    root: INFO
