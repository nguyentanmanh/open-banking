spring:
  application:
    name: open-banking
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  messages:
    basename: messages
    fallback-to-system-locale: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${PORT:8080}
  shutdown: graceful
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [service=${spring.application.name},requestId=%X{requestId:-},traceId=%X{traceId:-}] %logger{40} : %msg%n"
---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    root: INFO
